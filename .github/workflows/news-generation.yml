name: News Generation

on:
  schedule:
    # 6:00 AM UAE (UTC+4) = 2:00 AM UTC
    - cron: '0 2 * * *'
    # 6:00 PM UAE (UTC+4) = 2:00 PM UTC
    - cron: '0 14 * * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Time slot to generate (morning or evening)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Determine time slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.time_slot }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            echo "slot=morning" >> $GITHUB_OUTPUT
          else
            echo "slot=evening" >> $GITHUB_OUTPUT
          fi

      - name: Trigger English news generation
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          echo "Triggering English $SLOT news generation..."
          # Generation is fire-and-forget — endpoint returns immediately (200 started).
          # The backend self-pings /health every 10 min to keep the Render dyno alive.
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            --retry 3 --retry-delay 15 --retry-connrefused \
            --max-time 60 --connect-timeout 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"language":"en"}' \
            "${{ secrets.BACKEND_URL }}/api/generate/$SLOT")
          echo "HTTP status: $RESPONSE"
          cat /tmp/response.json
          if [ "$RESPONSE" != "200" ]; then
            echo "Error: backend returned $RESPONSE"
            exit 1
          fi
          echo "English generation accepted by backend."

      - name: Trigger Arabic news generation (morning only)
        if: ${{ github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.time_slot == 'morning') }}
        run: |
          echo "Triggering Arabic morning news generation..."
          RESPONSE=$(curl -s -o /tmp/response-ar.json -w "%{http_code}" \
            --retry 3 --retry-delay 15 --retry-connrefused \
            --max-time 60 --connect-timeout 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"language":"ar"}' \
            "${{ secrets.BACKEND_URL }}/api/generate/morning")
          echo "HTTP status: $RESPONSE"
          cat /tmp/response-ar.json
          if [ "$RESPONSE" != "200" ]; then
            echo "Error: Arabic generation returned $RESPONSE"
            exit 1
          fi
          echo "Arabic generation accepted by backend."
