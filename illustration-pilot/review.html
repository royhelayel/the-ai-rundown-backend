<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadioNews illustrated reveal pilot</title>
<style>body{background:#fbf8eb;color:#222a20;font:16px system-ui;margin:32px}main{display:flex;gap:24px;flex-wrap:wrap}article{width:min(100%,360px)}h1{font-size:28px}h2{font-size:19px}p{line-height:1.5}figure{position:relative;margin:0;aspect-ratio:4/5;overflow:hidden}figure img{position:absolute;width:100%;height:100%}button{padding:10px 16px;cursor:pointer}small{color:#60665b}pre{white-space:pre-wrap;font-size:12px}</style>
<h1>Illustrated reveal pilot</h1><p>Three first-pass images and model-planned reveals. Silent timing demonstration, not narration synchronization. Existing Oct 31 summaries; not today's reporting.</p><p id="status">Loading…</p><main></main>
<script>
(async()=>{const r=await(await fetch('/api/illustration-pilot')).json();document.querySelector('#status').textContent='Status: '+r.status;for(const s of r.stories||[]){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=s.headline;a.append(h);if(s.imageReady){const f=document.createElement('figure');a.append(f);const regions=s.plan?.regions||[{top:0,bottom:1}];for(const region of regions){const img=document.createElement('img');img.src='/api/illustration-pilot/image/'+s.id;img.style.clipPath=`inset(${region.top*100}% 0 ${(1-region.bottom)*100}% 0)`;f.append(img);}const play=document.createElement('button');play.textContent='Replay reveals';const replay=()=>{[...f.children].forEach((img,i)=>{img.getAnimations().forEach(x=>x.cancel());img.animate([{opacity:0},{opacity:1}],{duration:650,delay:i*3000,fill:'both',easing:'ease-out'});});};play.onclick=replay;a.append(play);replay();}const p=document.createElement('p');p.textContent=s.summary;a.append(p);const d=document.createElement('pre');d.textContent=JSON.stringify({status:s.status,elapsedSeconds:s.elapsedMs/1000,error:s.error,plan:s.plan},null,2);a.append(d);document.querySelector('main').append(a);}})();
</script>
